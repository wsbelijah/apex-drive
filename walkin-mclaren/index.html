<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX DRIVE — 720S Walk-In Concept</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#0a0a0b; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color:#f5f2ea; background:#0a0a0b; }
  .pin { height:520vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; background:#000; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .shade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(5,5,6,.72) 0%, rgba(5,5,6,0) 34%, rgba(5,5,6,0) 78%, rgba(5,5,6,.45) 100%); }
  .bar { position:absolute; top:0; left:0; height:3px; width:100%; background:rgba(245,242,234,.14); }
  .bar i { display:block; height:100%; width:100%; background:#e8b33c; transform-origin:0 50%; transform:scaleX(0); }
  .brand { position:absolute; top:26px; left:30px; font-size:13px; letter-spacing:.34em; font-weight:700; }
  .brand span { color:#e8b33c; }
  .tag { position:absolute; top:28px; right:30px; font-size:11px; letter-spacing:.22em; opacity:.65; text-transform:uppercase; }
  .phase { position:absolute; left:30px; bottom:88px; }
  .phase .k { font-size:12px; letter-spacing:.3em; color:#e8b33c; text-transform:uppercase; margin-bottom:10px; }
  .phase h1 { font-size:clamp(44px, 7.5vw, 96px); line-height:.98; font-weight:800; letter-spacing:-.01em; }
  .phase p { margin-top:12px; font-size:15px; opacity:.75; max-width:420px; line-height:1.45; }
  .credit { position:absolute; right:30px; bottom:30px; font-size:11px; letter-spacing:.14em; opacity:.55; text-transform:uppercase; text-align:right; line-height:1.7; }
  .hint { position:absolute; left:30px; bottom:30px; font-size:11px; letter-spacing:.26em; opacity:.6; text-transform:uppercase; }
  @media (max-width:640px){ .tag{ display:none } .phase{ bottom:104px } .hint{ display:none } }
  #cv { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
</style>
</head>
<body>
<div class="pin" id="pin">
  <div class="stage" id="stage">
    <video id="cv" muted playsinline preload="auto" src="walkin.mp4"></video>
    <div class="shade"></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="brand">APEX <span>DRIVE</span></div>
    <div class="tag">Hero concept — scroll walk-in</div>
    <div class="phase">
      <div class="k" id="phaseK">2019 McLaren 720S</div>
      <h1 id="phaseH">Walk up.</h1>
      <p id="phaseP">Black over black, 5,505 miles, sitting in San Clemente. This is the car.</p>
    </div>
    <div class="hint">Scroll</div>
    <div class="credit">Built from the listing's real photos<br>European Exotic Center · $259,995</div>
  </div>
</div>
<script>
(function(){
  var vid = document.getElementById('cv'),
      pin = document.getElementById('pin'),
      bar = document.getElementById('barFill'),
      H = document.getElementById('phaseH'), P = document.getElementById('phaseP'),
      target = 0, current = 0, dur = 0, primed = false;
  var PHASES = [
    { until: 0.25, h: 'Walk up.',  p: 'Black over black, 5,505 miles, sitting in San Clemente. This is the car.' },
    { until: 0.65, h: 'Get in.',   p: 'Dihedral door raised, carbon sill. The scroll does the walking.' },
    { until: 1.01, h: 'Your seat.', p: 'Behind the wheel \u2014 folding cluster lit. Where the hero lands.' }
  ];
  var phaseIdx = -1;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setPhase(p){
    for (var i = 0; i < PHASES.length; i++){
      if (p < PHASES[i].until){
        if (phaseIdx !== i){ phaseIdx = i; H.textContent = PHASES[i].h; P.textContent = PHASES[i].p; }
        return;
      }
    }
  }
  function onScroll(){
    var r = pin.getBoundingClientRect();
    var total = r.height - window.innerHeight;
    var p = total > 0 ? Math.min(Math.max(-r.top / total, 0), 1) : 0;
    if (dur) target = p * Math.max(dur - 0.05, 0);
    bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    setPhase(p);
  }
  function loop(){
    if (dur && !reduced){
      var d = target - current;
      if (Math.abs(d) > 0.015){
        current += d * 0.14;
        try { vid.currentTime = current; } catch(e){}
      }
    }
    requestAnimationFrame(loop);
  }
  function prime(){
    if (primed) return; primed = true;
    var pr = vid.play();
    if (pr && pr.then) pr.then(function(){ vid.pause(); try { vid.currentTime = current; } catch(e){} }).catch(function(){});
  }
  vid.addEventListener('loadedmetadata', function(){
    dur = vid.duration || 0;
    if (reduced){ try { vid.currentTime = Math.max(dur - 0.05, 0); } catch(e){} }
    onScroll();
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('pointerdown', prime, { once: true });
  window.addEventListener('touchstart', prime, { once: true, passive: true });
  onScroll();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
